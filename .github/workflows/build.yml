name: Build KPM
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Clone KernelPatch
      run: git clone https://github.com/bmax121/KernelPatch.git
    - name: Setup Files
      run: |
        cp devine_runner.c KernelPatch/kpms/
        cd KernelPatch/kpms
        printf "obj-m += devine_runner.o\nKDIR := \$(PWD)/../kernel\nPWD := \$(shell pwd)\n\nall:\n\t\$(MAKE) -C \$(KDIR) M=\$(PWD) modules\n" > Makefile
    - name: Compile KPM
      run: |
        cd KernelPatch/kpms
        make ARCH=arm64
    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: devine-kpm
        path: KernelPatch/kpms/devine_runner.ko
