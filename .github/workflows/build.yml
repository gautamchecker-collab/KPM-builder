name: Build KPM
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y gcc-aarch64-linux-gnu

    - name: Clone KernelPatch
      run: git clone https://github.com/bmax121/KernelPatch.git

    - name: Prepare files and create Makefile
      run: |
        mkdir -p KernelPatch/kpms/devine_runner
        cp devine_runner.c KernelPatch/kpms/devine_runner/
        cp devine_runner.lds KernelPatch/kpms/devine_runner/
        
        # Yahan hum GitHub server par hi sahi format mein Makefile likh rahe hain
        cat << 'MAKEFILE_EOF' > KernelPatch/kpms/devine_runner/Makefile
ifndef TARGET_COMPILE
$(error TARGET_COMPILE not set)
endif

ifndef KP_DIR
KP_DIR = ../..
endif

CC = $(TARGET_COMPILE)gcc

CFLAGS += -nostdinc -fno-pic -fno-PIC -fno-pie -fno-stack-protector
CFLAGS += -fno-asynchronous-unwind-tables -fno-unwind-tables -fno-exceptions

INCLUDE_DIRS := . include patch/include linux/include linux/arch/arm64/include linux/tools/arch/arm64/include
INCLUDE_FLAGS := $(foreach dir,$(INCLUDE_DIRS),-I$(KP_DIR)/kernel/$(dir))

objs := devine_runner.o

all: devine_runner.kpm

devine_runner.kpm: $(objs)
$(CC) -r -o $@ $^

%.o: %.c
$(CC) $(CFLAGS) $(INCLUDE_FLAGS) -c -O2 -o $@ $<

clean:
rm -rf *.kpm
MAKEFILE_EOF

    - name: Compile KPM
      run: |
        cd KernelPatch/kpms/devine_runner
        make TARGET_COMPILE=aarch64-linux-gnu- KP_DIR=../..

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: devine-kpm
        path: KernelPatch/kpms/devine_runner/devine_runner.kpm
