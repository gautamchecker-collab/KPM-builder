name: Build KPM
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y gcc-aarch64-linux-gnu

    - name: Clone KernelPatch
      run: git clone https://github.com/bmax121/KernelPatch.git

    - name: Prepare files
      run: |
        mkdir -p KernelPatch/kpms/devine_runner
        cp devine_runner.c KernelPatch/kpms/devine_runner/
        cp devine_runner.lds KernelPatch/kpms/devine_runner/
        cp Makefile KernelPatch/kpms/devine_runner/

    - name: Compile KPM
      run: |
        cd KernelPatch/kpms/devine_runner
        make TARGET_COMPILE=aarch64-linux-gnu- KP_DIR=../..

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: devine-kpm
        path: KernelPatch/kpms/devine_runner/devine_runner.kpm
