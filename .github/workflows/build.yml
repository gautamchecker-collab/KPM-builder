name: Build KPM
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y gcc-aarch64-linux-gnu

    - name: Clone KernelPatch
      run: git clone https://github.com/bmax121/KernelPatch.git

    - name: Prepare files and create Makefile
      run: |
        mkdir -p KernelPatch/kpms/devine_runner
        cp devine_runner.c KernelPatch/kpms/devine_runner/
        cp devine_runner.lds KernelPatch/kpms/devine_runner/
        
        # Yahan hum GitHub server par hi sahi TAB ke saath Makefile bana rahe hain
        printf 'ifndef TARGET_COMPILE\n$$(error TARGET_COMPILE not set)\nendif\n\nifndef KP_DIR\nKP_DIR = ../..\nendif\n\nCC = $$(TARGET_COMPILE)gcc\n\nCFLAGS += -nostdinc -fno-pic -fno-PIC -fno-pie -fno-stack-protector\nCFLAGS += -fno-asynchronous-unwind-tables -fno-unwind-tables -fno-exceptions\n\nINCLUDE_DIRS := . include patch/include linux/include linux/arch/arm64/include linux/tools/arch/arm64/include\nINCLUDE_FLAGS := $$(foreach dir,$$(INCLUDE_DIRS),-I$$(KP_DIR)/kernel/$$(dir))\n\nobjs := devine_runner.o\n\nall: devine_runner.kpm\n\ndevine_runner.kpm: $$(objs)\n\t$$(CC) -r -o $$@ $$^\n\n%%.o: %%.c\n\t$$(CC) $$(CFLAGS) $$(INCLUDE_FLAGS) -c -O2 -o $$@ $$<\n\nclean:\n\trm -rf *.kpm\n' > KernelPatch/kpms/devine_runner/Makefile

    - name: Compile KPM
      run: |
        cd KernelPatch/kpms/devine_runner
        make TARGET_COMPILE=aarch64-linux-gnu- KP_DIR=../..

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: devine-kpm
        path: KernelPatch/kpms/devine_runner/devine_runner.kpm
